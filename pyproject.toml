[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unav-sa"
version = "0.0.1"
description = "UNAV-SA — standalone real-time astronomical data navigator."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "UNAV-SA" }]
keywords = [
  "astronomy",
  "navigation",
  "catalog",
  "gaia",
  "sdss",
  "desi",
  "astropy",
  "virtual-observatory",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Operating System :: OS Independent",
]

# Conservative runtime/core dependencies. Heavy catalog-access and server
# stacks are intentionally optional (see [project.optional-dependencies]).
dependencies = [
  "astropy>=6.0",
  "numpy>=1.24",
  "pydantic>=2.5",
  "SQLAlchemy>=2.0",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
# Catalog / Virtual Observatory access. Kept optional so the core and any
# minimal runtime stay lightweight.
query = [
  "astroquery>=0.4.7",
  "pyvo>=1.5",
]
# Local API server (future).
server = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
# Development tooling.
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/fopearcano/unav-sa"
Repository = "https://github.com/fopearcano/unav-sa"

[tool.setuptools.packages.find]
# Only the standalone engine, app and server are installable packages.
# Adapters live outside the core runtime and are not installed with it.
include = ["unav_core*", "unav_app*", "unav_server*"]
exclude = ["adapters*", "tools*", "tests*", "docs*", "samples*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
# Make the in-repo packages importable during tests without an editable install.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
